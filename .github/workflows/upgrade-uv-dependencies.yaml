name: Upgrade Python dependencies

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: upgrade-python-dependencies

jobs:
  upgrade-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Upgrade dependencies
        run: uv sync --upgrade

      - name: Format Python code with Ruff
        run: uv run --locked ruff format

      - name: Open or update dependency pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            uv.lock
            :(glob)**/*.py
          branch: automation/uv-upgrade
          delete-branch: true
          commit-message: 'chore: upgrade Python dependencies'
          title: 'chore: upgrade Python dependencies'
          body: Updates `uv.lock` and applies any formatting changes from the upgraded Ruff version.
